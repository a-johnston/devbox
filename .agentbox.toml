# Agentbox project manifest. Paths are relative to this file.
version = 1

[image]
containerfile = ".agentbox/Containerfile"
context = ".agentbox"                   # keep source, .git and worktrees out of builds

[container]
cpus = 4
memory = "8G"

[builder]
memory = "4G"

[workspace]
# Container-local volumes over these paths. .worktrees keeps guest-created worktrees
# (and their outputs) in the VM: commit before `agentbox rm`.
artifacts = [".venv", ".pytest_cache", ".ruff_cache", "dist", ".worktrees"]

[environment]
UV_LINK_MODE = "copy"                   # uv cache and .venv are on different filesystems
PYTHONDONTWRITEBYTECODE = "1"           # keep __pycache__ out of the shared tree
COLORTERM = "truecolor"
