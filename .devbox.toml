# Devbox project manifest. Paths are relative to this file.
version = 1

[image]
containerfile = ".devbox/Containerfile"
context = ".devbox"                   # keep source, .git and worktrees out of builds

[container]
cpus = 4
memory = "8G"

[workspace]
# Container-local volumes over these paths. Guest-created worktree files stay in the VM:
# their commits are in the clone, but uncommitted files are lost on `devbox rm`.
artifacts = [".venv", ".pytest_cache", ".ruff_cache", "dist", ".worktrees"]

[review]
# Hooks that run on the host before landing; fetch flags branches that change them.
watch = ["prek.toml"]

[environment]
UV_LINK_MODE = "copy"                   # uv cache and .venv are on different filesystems
PYTHONDONTWRITEBYTECODE = "1"           # keep __pycache__ out of the shared tree
