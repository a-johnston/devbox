[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check (project venv)"
entry = "uv run --locked ruff check . --fix"
language = "system"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "ruff-format"
name = "ruff format (project venv)"
entry = "uv run --locked ruff format ."
language = "system"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "ty"
name = "ty check (project venv)"
entry = "uv run --locked ty check ."
language = "system"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "pytest"
name = "pytest (project venv)"
entry = "uv run --locked pytest"
language = "system"
types_or = ["python", "javascript"]
pass_filenames = false
