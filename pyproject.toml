[project]
name = "devbox"
version = "0.1.0"
description = "Disposable Apple containers for coding harnesses, with durable conversations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argcomplete>=3.6",
]

[project.scripts]
devbox = "devbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devbox"]

[dependency-groups]
dev = ["prek>=0.3.8", "pytest>=8", "ruff>=0.15.5", "ty>=0.0.21"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
