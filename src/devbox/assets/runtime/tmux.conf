# Deliberately independent of the host's tmux configuration.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind d detach-client
set -g default-terminal tmux-256color
set -g history-limit 20000
set -g escape-time 10
set -g extended-keys on
# Wheel events go to the app if it tracks the mouse, else scroll tmux history; without this
# the terminal turns wheel scrolling on the alternate screen into arrow keys.
set -g mouse on
# `on`, not `external`: apps in the pane (e.g. pi's OSC 52 copy) must reach the host clipboard.
set -g set-clipboard on
set -g status-right 'C-a d: detach | %H:%M'
set -g status-left-length 80
set -g status-right-length 40
set -g pane-border-style fg=colour240
set -g allow-rename off
set -g automatic-rename off
